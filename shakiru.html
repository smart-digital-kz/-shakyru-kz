<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кездесу туралы ақпарат</title>
    <style>
        :root { --accent: #8c8c8c; --bg: #121212; --text: #dcdcdc; }
        body { background: var(--bg); color: var(--text); font-family: 'Arial', sans-serif; margin: 0; line-height: 1.5; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; border: 1px solid #333; padding: 40px; }
        h1 { font-size: 1.5rem; color: #fff; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .timer { font-size: 1.2rem; color: var(--accent); margin: 20px 0; }
        .info-box { margin: 30px 0; }
        .map-box { margin-top: 30px; border: 1px solid #333; }
        iframe { width: 100%; height: 300px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>Кездесу шақыруы</h1>
    <p>Найрият, сені алдағы уақытта кездесуге шақырамын. Мақсатым — жай ғана әңгімелесіп, уақытты сапалы өткізу.</p>
    
    <div class="timer" id="timer">Есептелуде...</div>

    <div class="info-box">
        <p><strong>Орны:</strong> Lou Lou мейрамханасы, Достық көшесі, 13.</p>
        <p><strong>Уақыты:</strong> 07.06.2026, сағат 19:00.</p>
    </div>

    <div class="map-box">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2504.750529532508!2d71.4283592!3d51.1274944!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4245855f75e2f181!2z0YPQuy4g0JTQvtGB0YLRgNCw0YgsIDEz!5e0!3m2!1sru!2skz" allowfullscreen="" loading="lazy"></iframe>
    </div>
</div>

<script>
    const targetDate = new Date("June 7, 2026 19:00:00").getTime();
    function update() {
        const now = new Date().getTime();
        const diff = targetDate - now;
        if (diff <= 0) {
            document.getElementById("timer").innerHTML = "Кездесу уақыты жетті.";
            return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById("timer").innerHTML = `Кездесуге дейін: ${days} күн, ${hours} сағат қалды.`;
    }
    setInterval(update, 1000);
    update();
</script>

</body>
</html>
